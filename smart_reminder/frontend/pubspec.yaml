name: smart_notes
description: An AI-powered notes app with voice, reminders, and smart tagging.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Local storage
  shared_preferences: ^2.3.2

  # Networking
  http: ^1.2.1
  connectivity_plus: ^6.0.3

  # Notifications
  flutter_local_notifications: ^17.2.2

  # Date/time formatting
  intl: ^0.19.0

  # Icons
  cupertino_icons: ^1.0.8

  # ---------- Optional (uncomment when ready) ----------

  # Local database (alternative to SharedPreferences for large data)
  # hive: ^2.2.3
  # hive_flutter: ^1.1.0

  # Voice recording
  # record: ^5.1.2

  # Audio playback
  # audioplayers: ^6.0.0

  # Speech to text
  # speech_to_text: ^6.6.2

  # Image picking (for note attachments)
  # image_picker: ^1.1.2

  # Permissions
  # permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  # hive_generator: ^2.0.1      # Uncomment with hive
  # build_runner: ^2.4.9        # Uncomment with hive

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/sounds/
    - assets/icons/

  # fonts:
  #   - family: YourFont
  #     fonts:
  #       - asset: assets/fonts/YourFont-Regular.ttf
  #       - asset: assets/fonts/YourFont-Bold.ttf
  #         weight: 700
