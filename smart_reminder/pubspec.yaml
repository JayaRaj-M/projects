name: noteapp
description: A modern productivity notes app

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.1

  # Database
  sqflite: ^2.3.0
  path: ^1.8.3

  # HTTP
  http: ^1.1.0
  dio: ^5.3.2

  # Notifications
  flutter_local_notifications: ^16.1.0
  timezone: ^0.9.2

  # Voice / Audio
  record: ^5.0.4
  just_audio: ^0.9.36
  permission_handler: ^11.0.1

  # UI
  flutter_staggered_grid_view: ^0.7.0
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.7
  lottie: ^2.7.0
  shimmer: ^3.0.0
  intl: ^0.18.1
  uuid: ^4.1.0
  shared_preferences: ^2.2.2

  # Icons
  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/sounds/
    - assets/icons/

  fonts:
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
        - asset: assets/fonts/DMSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans-Bold.ttf
          weight: 700